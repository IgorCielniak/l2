name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-l2:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip

      - name: Build l2 runtime library
        run: bash tools/build_l2_lib.sh

      - name: Upload libl2 .a artifact
        uses: actions/upload-artifact@v4
        with:
          name: l2-static
          path: build/libl2.a
          if-no-files-found: error

      - name: Upload libl2 .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: l2-dynamic
          path: build/libl2.so
          if-no-files-found: error

  test:
    needs: build-l2
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils unzip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch vendored libkeystone
        run: bash tools/fetch_keystone.sh

      - name: Download libl2 .a artifact
        uses: actions/download-artifact@v4
        with:
          name: l2-static
          path: build

      - name: Download libl2 .so artifact
        uses: actions/download-artifact@v4
        with:
          name: l2-dynamic
          path: build

      - name: Run the full test matrix
        # All suites: runtime, compile-time main, script, leak-check, integrity,
        # the runtime library build, and every Python test file.
        run: python3 run_test_matrix.py
        timeout-minutes: 45

  perf-gate:
    # Compile-time performance against the pull request's base commit
    # (interleaved A/B runs, so machine noise affects both sides alike).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils unzip
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          bash tools/fetch_keystone.sh

      - name: Check out the base commit
        run: git worktree add ../l2-base ${{ github.event.pull_request.base.sha }}

      - name: Compare compile time with the base
        run: python3 tools/bench_compile.py --ab ../l2-base --runs 9 --max-file-regression 5 --max-geomean 0
        timeout-minutes: 30
